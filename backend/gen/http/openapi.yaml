            email:
                type: string
                description: The email associated with the member.
                example: Consequatur ex quasi earum et.
            family:
                $ref: '#/definitions/Family'
            group:
                $ref: '#/definitions/Group'
            name:
                type: string
                description: Output only. The resource name.
                example: Quaerat nostrum sed.
            role:
                type: string
                description: The role granted by this permission.
                example: READER
                enum:
                    - ROLE_UNSPECIFIED
                    - OWNER
                    - WRITER
                    - READER
            user:
                $ref: '#/definitions/User'
        description: A single permission on the note. Associates a member with a role.
        example:
