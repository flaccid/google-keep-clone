swagger: "2.0"
info:
    title: Google Keep Clone API
    description: A clone of the Google Keep REST API, designed to mirror the official API surface.
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /v1/labels:
        get:
            tags:
                - labels
            summary: list labels
            description: Lists all labels.
            operationId: labels#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Label'
            schemes:
                - http
        post:
            tags:
                - labels
            summary: create labels
            description: Creates a new label.
            operationId: labels#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LabelsCreateRequestBody'
                    required:
                        - displayName
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Label'
            schemes:
                - http
    /v1/labels/{id}:
        delete:
            tags:
                - labels
            summary: delete labels
            description: Deletes a label.
            operationId: labels#delete
            parameters:
                - name: id
                  in: path
                  description: The ID of the label to delete.
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
            schemes:
                - http
        patch:
            tags:
                - labels
            summary: update labels
            description: Updates the display name of a label.
            operationId: labels#update
            parameters:
                - name: id
                  in: path
                  description: The ID of the label to update.
                  required: true
                  type: string
                - name: UpdateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LabelsUpdateRequestBody'
                    required:
                        - displayName
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Label'
            schemes:
                - http
    /v1/notes:
        get:
            tags:
                - notes
            summary: list notes
            description: Lists notes with optional filtering and pagination.
            operationId: notes#list
            parameters:
                - name: pageSize
                  in: query
                  description: The maximum number of results to return.
                  required: false
                  type: integer
                  format: int64
                - name: pageToken
                  in: query
                  description: The previous page's nextPageToken field.
                  required: false
                  type: string
                - name: filter
                  in: query
                  description: 'Filter for list results. Valid fields: createTime, updateTime, trashTime, trashed.'
                  required: false
                  type: string
                - name: search
                  in: query
                  description: Search term to filter notes by title and body text.
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ListNotesResponse'
            schemes:
                - http
        post:
            tags:
                - notes
            summary: create notes
            description: Creates a new note.
            operationId: notes#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  description: The note to create.
                  required: true
                  schema:
                    $ref: '#/definitions/Note'
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:
        get:
            tags:
                - notes
            summary: get notes
            description: Gets a note by id.
            operationId: notes#get
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
        delete:
            tags:
                - notes
            summary: delete notes
            description: Deletes a note.
            operationId: notes#delete
            parameters:
                - name: id
                  in: path
                  description: The ID of the note to delete.
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
            schemes:
                - http
        patch:
            tags:
                - notes
            summary: update notes
            description: Updates a note. Fields not specified are left unchanged.
            operationId: notes#update
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
                - name: UpdateRequestBody
                  in: body
                  description: The note fields to update.
                  required: true
                  schema:
                    $ref: '#/definitions/NoteRequest'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:archive:
        post:
            tags:
                - notes
            summary: archive notes
            description: Archives a note.
            operationId: notes#archive
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:pin:
        post:
            tags:
                - notes
            summary: pin notes
            description: Pins a note.
            operationId: notes#pin
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:restore:
        post:
            tags:
                - notes
            summary: restore notes
            description: Restores a trashed note.
            operationId: notes#restore
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:trash:
        post:
            tags:
                - notes
            summary: trash notes
            description: Trashes a note.
            operationId: notes#trash
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:unarchive:
        post:
            tags:
                - notes
            summary: unarchive notes
            description: Unarchives a note.
            operationId: notes#unarchive
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{id}:unpin:
        post:
            tags:
                - notes
            summary: unpin notes
            description: Unpins a note.
            operationId: notes#unpin
            parameters:
                - name: id
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Note'
            schemes:
                - http
    /v1/notes/{noteId}/attachments:
        post:
            tags:
                - media
            summary: upload media
            description: Uploads an attachment to a note.
            operationId: media#upload
            parameters:
                - name: noteId
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
                - name: Content-Type
                  in: header
                  description: The MIME type of the attachment.
                  required: true
                  type: string
                - name: bytes
                  in: body
                  description: The attachment data.
                  required: true
                  schema:
                    type: string
                    format: byte
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/Attachment'
            schemes:
                - http
    /v1/notes/{noteId}/attachments/{attachmentId}:
        get:
            tags:
                - media
            summary: download media
            description: Downloads an attachment.
            operationId: media#download
            produces:
                - application/octet-stream
            parameters:
                - name: mimeType
                  in: query
                  description: The requested MIME type. Must be one of the attachment's mimeType values.
                  required: false
                  type: string
                - name: alt
                  in: query
                  description: The alt query parameter. Use 'media' to return raw bytes; omit to return Attachment metadata.
                  required: false
                  type: string
                - name: noteId
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
                - name: attachmentId
                  in: path
                  description: The ID of the attachment.
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
                        format: byte
            schemes:
                - http
    /v1/notes/{noteId}/permissions:batchCreate:
        post:
            tags:
                - permissions
            summary: batchCreate permissions
            description: Atomically creates or updates permissions. Only the actual note owner may mutate permissions. Duplicate emails are invalid; returned resource names use persisted IDs.
            operationId: permissions#batchCreate
            parameters:
                - name: noteId
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
                - name: BatchCreateRequestBody
                  in: body
                  description: The permissions to create.
                  required: true
                  schema:
                    $ref: '#/definitions/BatchCreatePermissionsRequest'
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Permission'
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /v1/notes/{noteId}/permissions:batchDelete:
        post:
            tags:
                - permissions
            summary: batchDelete permissions
            description: Atomically deletes permissions for the actual note owner. Duplicate or foreign-note names are invalid. Missing IDs are idempotent after authorization; grantor identity does not prevent owner revocation.
            operationId: permissions#batchDelete
            parameters:
                - name: noteId
                  in: path
                  description: The ID of the note.
                  required: true
                  type: string
                - name: BatchDeleteRequestBody
                  in: body
                  description: The permissions to delete.
                  required: true
                  schema:
                    $ref: '#/definitions/BatchDeletePermissionsRequest'
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
definitions:
    Attachment:
        title: Attachment
        type: object
        properties:
            mimeType:
                type: array
                items:
                    type: string
                    example: Nobis ea dolores pariatur quia.
                description: The MIME types in which the attachment is available.
                example:
                    - Aut soluta optio sequi facilis fugit aut.
                    - Omnis consequatur sed ex temporibus.
                    - Aut distinctio tempore ipsa.
            name:
                type: string
                description: The resource name of the attachment.
                example: Omnis odit velit.
        description: The created attachment.
        example:
            mimeType:
                - Odit accusantium eum quia quia quibusdam.
                - Quaerat amet qui.
            name: Provident voluptates ut ut velit dolor.
    BatchCreatePermissionsRequest:
        title: BatchCreatePermissionsRequest
        type: object
        properties:
            requests:
                type: array
                items:
                    $ref: '#/definitions/CreatePermissionRequest'
                description: The permission requests to create.
                example:
                    - email: Ipsum consequuntur totam et sit iusto.
                      role: ROLE_UNSPECIFIED
                    - email: Ipsum consequuntur totam et sit iusto.
                      role: ROLE_UNSPECIFIED
                    - email: Ipsum consequuntur totam et sit iusto.
                      role: ROLE_UNSPECIFIED
                    - email: Ipsum consequuntur totam et sit iusto.
                      role: ROLE_UNSPECIFIED
        description: Request to create one or more permissions on a note.
        example:
            requests:
                - email: Ipsum consequuntur totam et sit iusto.
                  role: ROLE_UNSPECIFIED
                - email: Ipsum consequuntur totam et sit iusto.
                  role: ROLE_UNSPECIFIED
                - email: Ipsum consequuntur totam et sit iusto.
                  role: ROLE_UNSPECIFIED
                - email: Ipsum consequuntur totam et sit iusto.
                  role: ROLE_UNSPECIFIED
    BatchDeletePermissionsRequest:
        title: BatchDeletePermissionsRequest
        type: object
        properties:
            names:
                type: array
                items:
                    type: string
                    example: Incidunt culpa dicta est delectus et.
                description: The resource names of the permissions to delete.
                example:
                    - Voluptatum eos voluptates voluptas ut odio.
                    - Nulla autem.
                    - Et odio voluptatibus id neque voluptatem pariatur.
                    - Ipsum alias.
        description: Request to delete one or more permissions on a note.
        example:
            names:
                - Reprehenderit voluptatem voluptas quidem.
                - Magni quia mollitia.
                - Optio cum reprehenderit non rem ducimus aut.
    CreatePermissionRequest:
        title: CreatePermissionRequest
        type: object
        properties:
            email:
                type: string
                description: The email of the user to grant the permission to.
                example: Eum aut.
            role:
                type: string
                description: The role to grant.
                example: READER
                enum:
                    - ROLE_UNSPECIFIED
                    - OWNER
                    - WRITER
                    - READER
        description: A request to create a single permission.
        example:
            email: Et alias omnis officia est aut corporis.
            role: OWNER
    Family:
        title: Family
        type: object
        description: Describes a single Google Family. Empty type.
        example: {}
    Group:
        title: Group
        type: object
        properties:
            email:
                type: string
                description: The group email.
                example: Beatae vel aut.
        description: Describes a single group.
        example:
            email: Cum necessitatibus.
    Label:
        title: Label
        type: object
        properties:
            displayName:
                type: string
                description: The display name of the label.
                example: Quas est aut rem.
            name:
                type: string
                description: The resource name of the label (e.g. 'labels/{uuid}').
                example: Voluptatem ea.
        description: A label that can be assigned to notes.
        example:
            displayName: Quis nihil est quasi in sit voluptatem.
            name: Numquam voluptatibus voluptas sapiente eligendi.
    LabelsCreateRequestBody:
        title: LabelsCreateRequestBody
        type: object
        properties:
            displayName:
                type: string
                description: The display name of the label.
                example: Provident doloribus et.
        example:
            displayName: Odio dolores totam est aut.
        required:
            - displayName
    LabelsUpdateRequestBody:
        title: LabelsUpdateRequestBody
        type: object
        properties:
            displayName:
                type: string
                description: The new display name for the label.
                example: Commodi aliquam consequatur delectus rem.
        example:
            displayName: Quo hic amet tenetur.
        required:
            - displayName
    ListContent:
        title: ListContent
        type: object
        properties:
            listItems:
                type: array
                items:
                    $ref: '#/definitions/ListItem'
                description: The items in the list.
                example:
